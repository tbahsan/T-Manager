<!DOCTYPE html>
<!--
  T-Manager popup — tabbed UI shell
  Author : Tasneem Bin Ahsan (TBA) · https://github.com/tbahsan
  Project: github.com/tbahsan/t-manager · plan §১২
  Android note: the same views render inside options.html (full tab) on
  Firefox for Android, where popups don't exist (plan §১২).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>T-Manager</title>
</head>
<body>
  <!-- Header: logo, account switcher chip, quota badge -->
  <header class="header">
    <div class="brand">
      <img src="../icons/icon48.png" alt="T-Manager logo" class="logo" />
      <span class="name" id="app-name">T-Manager</span>
    </div>
    <div class="header-right">
      <button id="account-chip" class="chip" title="Switch channel">…</button>
      <span id="quota-badge" class="quota-badge" title="Local estimate — resets midnight PT">–</span>
    </div>
  </header>

  <!-- Tabs (rendered by popup.js from the view registry) -->
  <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>

  <!-- Active view -->
  <main id="view" class="view" role="tabpanel"></main>

  <!-- Author credit footer — visible on EVERY tab (plan §২.5) -->
  <footer class="footer">
    <a href="https://github.com/tbahsan" target="_blank" rel="noopener">
      © 2026 TBA · Made with <span class="heart">❤️</span> · github.com/tbahsan
    </a>
    <a href="https://github.com/tbahsan/T-Manager/issues/new/choose" target="_blank" rel="noopener" class="issue-link" title="Bug? Idea? Open a GitHub issue — it shapes the roadmap"> · 🐛 Feedback</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
