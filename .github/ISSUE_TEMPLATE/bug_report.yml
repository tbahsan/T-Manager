name: 🐛 Bug report
description: Something doesn't work the way it should — tell us and we'll fix it.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for helping make T-Manager better!** 🇧🇩
        Please search existing issues first — if yours exists, add a 👍 instead of opening a duplicate.
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Connect / sign-in (OAuth)
        - Dashboard
        - Rename / numbering
        - Thumbnails
        - Description
        - Tags
        - Upload queue
        - Analytics
        - History / Undo
        - Multi-channel switching
        - Quota tracker
        - Settings / language
        - Other
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome (desktop)
        - Firefox (desktop)
        - Firefox for Android
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead? Error messages welcome — copy the exact text.
      placeholder: Tell us what you saw…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps starting from opening the popup.
      placeholder: |
        1. Open Rename tab
        2. Select 'All Shorts'
        3. Press Run…
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / console output
      description: Drag screenshots here. Console output helps a lot (right-click the popup → Inspect → Console tab).
  - type: input
    id: version
    attributes:
      label: T-Manager version
      placeholder: "e.g. v0.1.0"
    validations:
      required: true
